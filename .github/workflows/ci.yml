# Runs exactly what README.md "Development" documents, so the two cannot drift.
name: CI

on:
  pull_request:
  # Also on push, not only on pull_request: two PRs can each be green alone and
  # break an invariant once both land -- one renames a reference section, the
  # other adds a pointer to the old name. Only a post-merge run sees that.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the suites are developed against; 3.11 establishes the
        # floor; 3.15 is the next release.
        python: ["3.11", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-skills.py scans commit messages for attribution trailers, and
          # the default shallow clone would hide all but the tip.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          # Use a release candidate while a version has no final release yet.
          allow-prereleases: true
      # The helpers and their tests are standard library only, and every suite is
      # offline (network lookups are stubbed).
      # check-geectl.py runs against the released CLI from crates.io.
      # Bump the version to re-validate against a newer geectl.
      # contrib/container/skill-container is the one exception: it reads the
      # tea config with ruamel.yaml, as its Dockerfile already installs
      # (python3-ruamel.yaml), so CI installs it too. The launcher resets
      # PATH to the system directories, so it is the system python3 that
      # needs it: a pip install lands in the setup-python site-packages,
      # which that python never sees.
      - name: Install ruamel.yaml
        run: sudo apt-get update && sudo apt-get install -y python3-ruamel.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - name: Install geectl
        run: cargo install geectl --version 0.2.3
      - name: Script suites
        # `|| rc=1` and NOT `|| break`: break returns 0, so the loop would report
        # success on a failing suite -- green forever, for no reason anyone sees.
        run: (rc=0; for t in tests/test-*.sh; do bash "$t" || rc=1; done; exit $rc)
      - name: Python suite
        run: python3 tests/test-update-checkers.py
      - name: Repository gates
        run: |
          python3 tests/repo/check-skills.py
          python3 tests/repo/check-flags.py
          python3 tests/repo/check-geectl.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned exactly: `format --check` output moves between releases, which
      # would fail the build on a change nobody made. The rule selection is
      # pinned in ruff.toml for the same reason -- the default set differs
      # between ruff builds, not just between versions.
      - run: pipx install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck tests/test-*.sh
      # The pool PR gate's own scripts. The older scripts are not listed: they
      # carry findings nobody has triaged yet.
      - run: shellcheck skills/opensuse-packaging/scripts/{leap-sync,pool-pr,target-gate}.sh
      # No shfmt: it rewrites the suites' deliberate one-line guards and aligned
      # helper definitions into multi-line blocks -- ~530 lines of churn that
      # makes the assertions harder to read and finds no defects. shellcheck,
      # which finds real ones, is blocking above.

  # quilt-prep.sh and quilt-test-series.sh need quilt and an rpm that lays the
  # build directory out as rpm 4.20 does: the runner's own (4.18) does not, and
  # the suite's functional cases print SKIP in the job above.
  quilt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      # The mirrors answer 403 now and then, and zypper then finds no package:
      # a failed refresh is tried again, not taken for the suite's verdict.
      - run: |
          for try in 1 2 3; do
            zypper -n refresh --force && zypper -n install --no-recommends quilt rpm-build tar gzip git-core && exit 0
            sleep 30
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: QUILT_TESTS=require bash tests/test-quilt-scripts.sh
