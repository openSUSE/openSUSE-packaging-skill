# Example of the drop-in `skill-container install work` writes for the instance
# "work", as ~/.config/containers/systemd/opensuse-packaging-agent@work.container.d/10-workdir.conf.
# Beside it install makes opensuse-packaging-agent@work.container, a link to the
# template opensuse-packaging-agent@.container: Quadlet reads an instance's
# drop-in only then. Without the launcher, write both by hand and create the
# podman secrets the template names, then: systemctl --user daemon-reload &&
# systemctl --user start opensuse-packaging-agent@work
[Container]
# The work directory on the host, and where the agent sees it.
Volume=/home/user/agent-ws/work:/home/user/obs:Z
WorkingDir=/home/user/obs
# The image `update` pulls and the unit runs: here a published one.
Image=registry.example.org/agents/opensuse-packaging-agent:latest
# Your git name and e-mail address, as a file of this instance.
Volume=/home/user/.config/skill-container/opensuse-packaging/work.gitconfig:/home/agent/.config/git/config:ro,Z
