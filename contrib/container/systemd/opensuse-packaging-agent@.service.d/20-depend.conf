# The clients container shares the servers network: without --depend the
# server cannot be removed while a client is on it, and the unit fails
# with both containers left behind.
[Service]
ExecStop=
ExecStop=/usr/bin/podman rm -v -f -i --depend opensuse-packaging-%i-agent
ExecStopPost=
ExecStopPost=/usr/bin/podman rm -v -f -i --ignore --depend opensuse-packaging-%i-agent
