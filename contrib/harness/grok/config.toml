# Merge into ~/.grok/config.toml. A deny beats ask and allow from every source
# and still applies under always-approve.
[permission]
deny = [
  # Path globs: the read tool, grep (the path, plus ripgrep excludes), and files
  # that shell readers and redirects name (cat, head, sed, base64, < file).
  # "~/" is literal here, so home paths use "**/"; "X/**" does not match X itself.
  "Read(**/.config/osc)",
  "Read(**/.config/osc/**)",
  "Read(**/.oscrc)",
  "Read(**/.config/tea)",
  "Read(**/.config/tea/**)",
  "Read(**/.config/gh/hosts.yml)",
  "Read(**/.netrc)",
  "Read(**/.git-credentials)",
  "Read(**/.local/state/osc)",
  "Read(**/.local/state/osc/**)",
  "Read(**/.config/mcp-bugzilla)",
  "Read(**/.config/mcp-bugzilla/**)",
  # Command globs, matched against the whole command and each segment;
  # "*" crosses spaces and "/".
  "Bash(*.config/osc*)",
  "Bash(*oscrc*)",
  "Bash(*.config/tea*)",
  "Bash(*gh/hosts.yml*)",
  "Bash(*.config/gh/*)",
  "Bash(*.config/gh)",
  "Bash(*.config/gh *)",
  "Bash(*.config/gh\"*)",
  "Bash(*.config/gh'*)",
  "Bash(*.netrc*)",
  "Bash(*.git-credentials*)",
  "Bash(*gh auth token*)",
  "Bash(*gh auth status*)",
  "Bash(*gh auth git-credential*)",
  "Bash(*-H*uthorization*)",
  "Bash(*-*H *uthorization*)",
  "Bash(*--header*uthorization*)",
  "Bash(*--apikey*)",
  "Bash(*--apisecret*)",
  "Bash(*://*:*@*)",
  "Bash(git-obs *login list*)",
  "Bash(git obs *login list*)",
  "Bash(*gitcredentials-helper*)",
  "Bash(*login helper*)",
  "Bash(*logins helper*)",
  "Bash(*login git-credential*)",
  "Bash(*logins git-credential*)",
  "Bash(tea login e*)",
  "Bash(tea logins e*)",
  "Bash(osc *--dump-*)",
  "Bash(*--http-d*)",
  "Bash(*--http-f*)",
  "Bash(*http_debug*)",
  "Bash(*http_full_debug*)",
  "Bash(*HTTP_DEBUG*)",
  "Bash(*HTTP_FULL_DEBUG*)",
  "Bash(osc -H*)",
  "Bash(osc * -H*)",
  "Bash(osc -*H *)",
  "Bash(osc -*H)",
  "Bash(osc token*)",
  "Bash(osc config * pass*)",
  "Bash(osc *api*/person/*/token*)",
  "Bash(*credential fill*)",
  "Bash(*secret-tool lookup*)",
  "Bash(*secret-tool search*)",
  "Bash(*git credential-* get*)",
  "Bash(*git-credential-* get)",
  "Bash(*git-credential-* get *)",
  "Bash(*osc/cookiejar*)",
  "Bash(*.local/state/osc*)",
  "Bash(*.config/mcp-bugzilla*)",
  "Bash(*GIT_ASKPASS=*)",
  "Bash(*SSH_ASKPASS=*)",
  "Bash(*core.askPass*)",
  "Bash(*core.askpass*)",
  "Bash(curl *api.opensuse.org*)",
  "Bash(curl *build.opensuse.org*)",
  "Bash(curl *src.opensuse.org/api*)",
  # Merging a PR on src.opensuse.org is never an agent's job; gh is not matched.
  "Bash(tea pr *merge *)",
  "Bash(tea pr m *)",
  "Bash(tea pulls *merge *)",
  "Bash(tea pulls m *)",
  "Bash(tea pull *merge *)",
  "Bash(tea pull m *)",
  "Bash(tea api */pulls/*/merge*)",
  "Bash(git-obs *pr merge*)",
  "Bash(git obs *pr merge*)",
  "Bash(git-obs *api*/pulls/*/merge*)",
  "Bash(git obs *api*/pulls/*/merge*)",
  "Bash(*src.opensuse.org*/pulls/*/merge*)",
  "Bash(*repos/pool/*/pulls/*/merge*)",
  # A Factory request comes from the registered devel project.
  "Bash(osc sr *--nodevelproject*)",
  "Bash(osc submitreq *--nodevelproject*)",
  "Bash(osc submitrequest *--nodevelproject*)",
  "Bash(osc submitpac *--nodevelproject*)",
  "Bash(osc creq *--nodevelproject*)",
  "Bash(osc createrequest *--nodevelproject*)",
  # Build roots are entered with osc chroot.
  "Bash(sudo chroot *)",
]
