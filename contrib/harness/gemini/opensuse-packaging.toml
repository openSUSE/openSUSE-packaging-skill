# Copy to ~/.gemini/policies/opensuse-packaging.toml (user tier).
# User tier: priority 999 -> 4.999, above YOLO allow-all (1.998) and
# "Allow for all future sessions" rules (3.950 / 4.950).
# argsPattern is tried against the tool's JSON-encoded arguments; commandRegex
# becomes '"command":"' + regex, so each alternative floats itself with a leading
# [^\x00]*, which also reaches the description and directory arguments.
# The loader refuses a quantifier on a group that holds one, as in (a+)*.
# A rule of several parts is a row of lookaheads tried at each simple command's
# start and stopped at the next ; & or |: a gap between parts ([^\x00]* inside
# [^\x00]*) backtracked cubically and hung the matcher on a long command.

[[rule]]
toolName = ["read_file", "read_many_files", "list_directory", "glob", "grep_search"]
argsPattern = '\.config/(gh|geectl|tea|mcp-bugzilla)\b|gh/hosts\.yml|\.netrc|\.git-credentials|\.config/git/credentials'
decision = "deny"
priority = 999
denyMessage = "Credential files (geectl, tea, gh, netrc, git credentials, API keys) are off limits: the CLIs read their own config."

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00]*\.config/(gh|geectl|tea|mcp-bugzilla)\b|[^\x00]*gh/hosts\.yml|[^\x00]*\.netrc|[^\x00]*\.git-credentials|[^\x00]*\.config\}?/git/credentials|[^\x00]*CONFIG_HOME\}?/git/credentials|[^\x00]*\b(GIT|SSH)_ASKPASS\s*=|[^\x00]*core\.ask[Pp]ass|[^\x00]*(-[a-zA-Z]*H|--header)[\s=]*\\?[\x27"]?[Aa]uthorization\s*:|[^\x00]*--api(key|secret)|[^\x00]*://[^\s/:@]+:[^\s/@]+@|[^\x00]*?(?:(?<=[;&|])|(?<=command":"))(?=[^\x00;&|]*?\bcurl\s)(?=[^\x00;&|]*?(api\.opensuse\.org|build\.opensuse\.org|src\.opensuse\.org/api)))'
decision = "deny"
priority = 999
denyMessage = "Credentials stay inside geectl, tea and git-obs, and OBS and the Gitea API are reached only through them."

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00]*\bgh\s+auth\s+(token|status|git-credential)\b|[^\x00]*gitcredentials-helper|[^\x00]*\blogins?\s+(helper|git-credential)\b|[^\x00]*\bcredential\s+fill\b|[^\x00]*\bgit[- ]credential-[\w.-]{1,64}\s+get\b|[^\x00]*\bsecret-tool\s+(lookup|search)\b|[^\x00]*\bgeectl\s+remote\s+create-token\b|[^\x00]*\bgeectl\s+--[a-z-]+\s+remote\s+create-token\b|[^\x00]*\bgeectl\s+--[a-z-]+\s+[^\s;&|]+\s+remote\s+create-token\b|[^\x00]*\bgeectl\s+-[a-zA-Z]\s+remote\s+create-token\b|[^\x00]*\bGEECTL_(?:OBS|GITEA)_|[^\x00]*?(?:(?<=[;&|])|(?<=command":"))(?=[^\x00;&|]*?\bgit[- ]obs\s)(?=[^\x00;&|]*?\blogin\s+list\b)|[^\x00]*?(?:(?<=[;&|])|(?<=command":"))(?=[^\x00;&|]*?\btea\s)(?=[^\x00;&|]*?\blogins?\s+(edit|e)\b))'
decision = "deny"
priority = 999
denyMessage = "This command prints a token or password; the tools use their credentials themselves."

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00]*\btea\s+(pr|pulls?)\s+m\b|[^\x00]*?(?:(?<=[;&|])|(?<=command":"))(?=[^\x00;&|]*?\btea\s)(?=[^\x00;&|]*?\b(pr|pulls?)\b)(?=[^\x00;&|]*?\bmerge\b)|[^\x00]*?(?:(?<=[;&|])|(?<=command":"))(?=[^\x00;&|]*?\bgit[- ]obs\s)(?=[^\x00;&|]*?(\bpr\s+merge\b|/pulls/[^/]+/merge))|[^\x00]*?(?:(?<=[;&|])|(?<=command":"))(?=[^\x00;&|]*?src\.opensuse\.org)(?=[^\x00;&|]*?/pulls/[^/]+/merge)|[^\x00]*?(?:(?<=[;&|])|(?<=command":"))(?=[^\x00;&|]*?repos/pool/)(?=[^\x00;&|]*?/pulls/[^/]+/merge))'
decision = "deny"
priority = 999
denyMessage = "Merging a pull request on src.opensuse.org is the maintainer's call, never an agent's."

[[rule]]
toolName = "run_shell_command"
commandRegex = '(?:[^\x00]*\bsudo\s+chroot\b|[^\x00]*?(?:(?<=[;&|])|(?<=\\n)|(?<=command":")|(?<=\bdo )|(?<=\bthen ))\s*sudo\b|[^\x00]*?(?:(?<=[;&|])|(?<=command":"))(?=[^\x00;&|]*?\bgeectl\s)(?=[^\x00;&|]*?\brequest\s+(file|refile)\b)(?=[^\x00;&|]*?--target-project\b)(?=[^\x00;&|]*?openSUSE:Factory\b))'
decision = "deny"
priority = 999
denyMessage = "A Factory request comes from the registered devel project, and an agent never runs sudo: build roots are entered with geectl local-build chroot and removed with geectl local-build wipe."
